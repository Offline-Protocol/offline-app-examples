# CI for every app under apps/.
#
# Don't list apps in this file. The `changes` job reads apps/ and picks which
# apps to run:
#   - PR touching only apps/<name>/ -> just those apps
#   - PR touching anything else (lockfile, packages/, this file, root config)
#     -> every app
#   - PR touching only docs (docs/, *.md, images) -> nothing
#   - push to main -> every app
#
# `check` (typecheck, lint, test, JS bundle), `android` and `ios` all run for
# that list. A new app is picked up automatically, as long as:
#   - apps/<name>/package.json is named @offline-app-examples/<name>
#   - apps/<name>/ios has exactly one <Scheme>.xcworkspace whose scheme has
#     the same name
#
# Branch protection should only require `check` and `native`, never per-app
# job names like `android (cowrite)`. Those only exist on PRs that touch that
# app. `native` rolls up all the android/ios jobs into one result.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      filter: ${{ steps.apps.outputs.filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit plus its parents, so HEAD^1..HEAD is the PR's diff.
          fetch-depth: 2
      - id: apps
        run: |
          all=$(ls apps | jq -Rsc 'split("\n") | map(select(length > 0))')
          apps=$all
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD | grep -vE '^docs/|\.(md|gif|png|jpe?g)$' || true)
            if [ -z "$files" ]; then
              apps='[]'
            elif ! grep -qv '^apps/' <<<"$files"; then
              apps=$(grep '^apps/' <<<"$files" | cut -d/ -f2 \
                | jq -Rsc --argjson all "$all" 'split("\n") | unique | map(select(IN($all[])))')
            fi
          fi
          echo "apps=$apps" | tee -a "$GITHUB_OUTPUT"
          # No turbo filter when every app runs, so packages/ is checked too.
          if [ "$apps" != "$all" ]; then
            filter=$(jq -r 'map("--filter=@offline-app-examples/" + .) | join(" ")' <<<"$apps")
          fi
          echo "filter=${filter:-}" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPS: ${{ needs.changes.outputs.apps }}
      FILTER: ${{ needs.changes.outputs.filter }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo typecheck $FILTER
      - run: pnpm exec turbo lint $FILTER
      - run: pnpm exec turbo test $FILTER
      - name: Bundle JavaScript for iOS and Android
        run: |
          for app in $(jq -r '.[]' <<<"$APPS"); do
            for platform in ios android; do
              echo "::group::$app $platform"
              (cd "apps/$app" && npx react-native bundle --platform "$platform" --dev false \
                --entry-file index.js --bundle-output "$RUNNER_TEMP/$app.$platform.jsbundle" \
                --assets-dest "$RUNNER_TEMP/assets-$app-$platform")
              echo "::endgroup::"
            done
          done

  android:
    needs: [check, changes]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          # One cache key per app — avoids matrix jobs overwriting the same Gradle
          # cache while Reanimated/Worklets prefab packages are half-built.
          cache-dependency-path: |
            apps/${{ matrix.app }}/android/**/*.gradle*
            apps/${{ matrix.app }}/android/gradle/wrapper/gradle-wrapper.properties
      - run: pnpm install --frozen-lockfile
      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          GRADLE=(./gradlew -PreactNativeArchitectures=x86_64 --no-daemon)
          # Prefab packages must exist before :app:configureCMakeDebug (Reanimated race).
          PREFAB=(
            :react-native-worklets:prefabDebugPackage
            :react-native-reanimated:prefabDebugPackage
          )
          for attempt in 1 2 3; do
            if "${GRADLE[@]}" "${PREFAB[@]}" assembleDebug; then
              exit 0
            fi
            echo "::warning::assembleDebug failed (attempt $attempt), clearing app native build dirs"
            rm -rf app/build app/.cxx
            sleep $((attempt * 10))
          done
          exit 1

  ios:
    needs: [check, changes]
    if: needs.changes.outputs.apps != '[]'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CocoaPods on the runner's default Ruby intermittently fails with
      # "pathname contains null byte" (CocoaPods/CocoaPods#12798), so use the
      # app's Gemfile on Ruby 3.2 and retry.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/${{ matrix.app }}
      - name: Install pods
        working-directory: apps/${{ matrix.app }}/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          CP_HOME_DIR: ${{ runner.temp }}/cocoapods
        run: |
          mkdir -p "$CP_HOME_DIR"
          for attempt in 1 2 3 4 5; do
            if bundle exec pod install; then
              exit 0
            fi
            echo "pod install failed (attempt $attempt), retrying"
            rm -rf Pods
            sleep $((attempt * 8))
          done
          exit 1
      - name: Build for the iOS simulator
        working-directory: apps/${{ matrix.app }}/ios
        run: |
          scheme=$(basename *.xcworkspace .xcworkspace)
          xcodebuild -workspace "$scheme.xcworkspace" -scheme "$scheme" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet build

  # Single required check for the native builds, since the matrix varies per PR.
  native:
    if: always()
    needs: [check, changes, android, ios]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "native builds passed or were not needed"
